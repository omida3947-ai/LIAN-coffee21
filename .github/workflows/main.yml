name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Remove local properties
      working-directory: ./LIAN_COFFEE_Android
      run: rm -f local.properties

    - name: Build APK with Gradle
      working-directory: ./LIAN_COFFEE_Android
      run: |
        chmod +x gradle/wrapper/gradle-wrapper.jar || true
        gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LIAN-Coffee-APK
        path: LIAN_COFFEE_Android/app/build/outputs/apk/debug/app-debug.apk
